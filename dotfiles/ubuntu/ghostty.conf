# Ubuntu version of the current terminal appearance.
# Install the named font separately, then run: ghostty +validate-config
font-family = JetBrainsMono Nerd Font Mono
font-size = 14
adjust-cell-height = 2
theme = Dracula
window-inherit-working-directory = true
tab-inherit-working-directory = true
split-inherit-working-directory = true
background-opacity = 1
window-padding-x = 8
window-padding-y = 6
window-theme = dark
confirm-close-surface = true
cursor-style = bar
cursor-style-blink = true
cursor-opacity = 0.85
mouse-hide-while-typing = true
copy-on-select = clipboard
clipboard-read = ask
clipboard-write = allow
clipboard-trim-trailing-spaces = true
clipboard-paste-protection = true
clipboard-paste-bracketed-safe = true
shell-integration = detect
scrollback-limit = 50000000
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = ctrl+shift+comma=reload_config
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+left=previous_tab
keybind = ctrl+shift+right=next_tab
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+e=new_split:down
keybind = alt+left=goto_split:left
keybind = alt+right=goto_split:right
keybind = alt+up=goto_split:up
keybind = alt+down=goto_split:down
keybind = ctrl+shift+enter=toggle_split_zoom
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+f=start_search
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size
