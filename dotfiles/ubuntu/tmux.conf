set -g mouse on
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2
bind c new-window -c "#{pane_current_path}"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind r source-file ~/.tmux.conf \; display "Config reloaded"
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"' ''
if-shell 'test -z "$WAYLAND_DISPLAY" && test -n "$DISPLAY" && command -v xclip >/dev/null' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"' ''
set -sg escape-time 0
set -g status-position bottom
set -g status-style "bg=#111827,fg=#d1d5db"
set -g status-left "#[fg=#38bdf8,bold] #S "
set -g status-right "#[fg=#c4b5fd] %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
setw -g monitor-activity on
set -g visual-activity off
